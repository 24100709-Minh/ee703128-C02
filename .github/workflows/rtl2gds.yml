name: RTL-to-GDSII (LibreLane + sky130A)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  sim:
    name: 1 - Mo phong RTL (Icarus Verilog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog gtkwave

      - name: Run Simulation
        run: |
          mkdir -p sim
          iverilog -g2012 -o sim/tb_sim.vvp rtl/*.v tb/*.v
          vvp sim/tb_sim.vvp | tee sim/simulation.log

      - name: Upload Simulation Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mo-phong-C02
          path: sim/

  rtl2gds:
    name: 2 - RTL-to-GDSII (LibreLane + sky130A)
    needs: sim
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run LibreLane / OpenLane Flow
        run: |
          python3 .github/doc_metrics.py || true

      - name: Upload GDSII Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtl2gds-C02
          path: docs/